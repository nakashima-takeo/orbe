# Package manifest
title = "orbe"
"quoted key" = true
site.url = "https://example.com"

[package]
name = "orbe"
version = "0.8.0"
authors = ["nakatake"]

[package.metadata]
docs = { features = ["full"], all = true }

[dependencies]
serde = { version = "1", features = ["derive"] }
tokio = "1"

[[bin]]
name = "orbe"
path = "src/main.rs"

[[bin]]
name = "orbe-cli"

[ "target".'cfg(unix)' ]
libc = "0.2"
