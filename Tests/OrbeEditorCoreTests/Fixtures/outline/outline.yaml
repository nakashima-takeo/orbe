# CI workflow
name: ci
on:
  push:
    branches: [main]
  pull_request: {}

env:
  "QUOTED KEY": 1
  'single': 2
  flow: { a: 1, b: [x, y] }

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          swift build
          swift test
      - plain item
  lint:
    anchors: &defaults
      timeout: 10
    <<: *defaults
---
second: document
? complex key
: complex value
