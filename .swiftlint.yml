included:
  - Sources
  - Tests
excluded:
  - vendor
  - build
  - .build

# 整形は swift format が所有する。swift format の正準出力と衝突するルールは SwiftLint 側を無効化。
disabled_rules:
  - trailing_comma # swift format は複数行コレクションに trailing comma を付ける
  - opening_brace # swift format は複数行宣言・条件の { を独立行に置く

custom_rules:
  bundled_resource_seam:
    name: "同梱リソースは BundledResources 経由"
    included: ".*/Sources/.*\\.swift"
    excluded: ".*/BundledResources\\.swift"
    # 同梱物の所在を取る API を全て挙げる。Info.plist 系（object(forInfoDictionaryKey:)・
    # infoDictionary・bundleIdentifier）は同梱物の解決ではないので対象外。
    # `(` の後の `\s*` は swift format の折返し（100 桁超は `(` 直後で改行する）を捕まえるため。
    regex: "Bundle\\.main\\.(resource(URL|Path)|bundle(URL|Path)|(url|urls|path|paths)\\(\\s*forResource)"
    message: "同梱リソースの解決は BundledResources.root を通す（唯一の注入点）"
    severity: error

  test_isolation_harness:
    name: "テストの基底は OrbeTestCase"
    included: ".*/Tests/OrbeTests/.*\\.swift"
    excluded: ".*/TestIsolation\\.swift"
    # `:` の後の `\s*` は改行にも当たる（swift format が 100 桁超を `:` の後で折り返す形を捕まえる）。
    regex: ":\\s*XCTestCase\\b"
    message: "テストクラスは OrbeTestCase を継承する（隔離ハーネスの点火点）"
    severity: error

identifier_name:
  min_length: 1 # 座標 (x, y, w, h)・ループ変数等の短い局所名は本リポジトリのイディオム

cyclomatic_complexity:
  ignores_case_statements: true # アクション/キーディスパッチの網羅 switch が中核イディオム

function_body_length:
  warning: 60

type_body_length:
  warning: 300
