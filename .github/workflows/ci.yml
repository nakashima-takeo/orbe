# 診断のブランチでだけ使う `.github/workflows/ci.yml`（PR #456 のブランチには入れない）。
# 本物の違反の診断（ScreenBreachRealProbeTests）だけを、CI の上で回す。lint は回さない（診断は、禁じた API をわざと呼ぶ）。
name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: build (incl. tests)
        run: swift build --build-tests
      - name: test (diagnostic only)
        run: swift test --skip-build --filter 'OrbeTests\.ScreenBreachRealProbeTests'
