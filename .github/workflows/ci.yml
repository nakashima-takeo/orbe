name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: build (incl. tests)
        run: swift build --build-tests
      - name: drag test x10 with and without the screen answer
        run: |
          set +e
          for mode in with without; do
            for i in $(seq 1 10); do
              if [ $mode = without ]; then export PROBE_NO_SCREEN=1; else unset PROBE_NO_SCREEN; fi
              swift test --skip-build --filter 'OrbeTests\.SidebarScrollbarTests/testDragging' 2>&1 | grep -E "SidebarScrollbarTests.swift:[0-9]+: error|SidebarScrollbarTests test.*(passed|failed)" | sed "s/^/$mode $i: /"
            done
          done
          unset PROBE_NO_SCREEN
          for i in 1 2 3; do swift test --skip-build --filter 'OrbeTests\.SidebarScrollbarTests/' 2>&1 | grep -E "SidebarScrollbarTests.swift:[0-9]+: error|Executed [0-9]+ tests" | sed "s/^/class $i: /"; done
      - name: test (23 classes that host the editor pane, and the placeOffscreen classes)
        run: |
          set +e
          swift test --skip-build --filter 'OrbeTests\.(UnsavedGateTests|EditorDiffTests|SourceControlPaneTests|EditorOccurrencesTests|EditorPaneSurfaceTests|EditorPaneViewCloseTests|EditorPaneViewTests|EditorPaneViewGutterTests|EditorPaneViewHeaderTests|EditorPaneViewInlineInputTests|EditorPaneViewPreviewTabTests|EditorPaneViewShellTests|EditorPaneViewSidebarTests|EditorPaneViewTabCloseTests|EditorSearchTests|EditorSurfaceHostTests|EditorZoneEditingMenuTests|FindInProjectTests|SidebarScrollbarTests|ProjectSearchPaneTests|PullRequestPaneTests|TabGroupTests|GroupFacesViewTests|TaskPaletteCardKeyTests|RowListTests|BoardAutomationTests|ChromeMiddleClickTests)/' > test.log 2>&1; r=$?
          grep -E "Test Suite '[A-Za-z]+Tests' (passed|failed)|Executed [0-9]+ tests|error:|failed \(|Fatal|signal" test.log | sort -u
          echo "exit=$r"
          exit $r
