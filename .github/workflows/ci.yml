name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-format:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
      - name: lint (SwiftLint)
        run: mise exec -- swiftlint lint --strict --quiet
      - name: format (swift format)
        run: swift format lint --strict --recursive Sources Tests Package.swift

  build-test:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # PR では、長時間ファズ（名前の末尾が AtFullScale のテスト）を飛ばす。ほかのイベントでは、この変数が空の文字列になり、長時間ファズも走る。
      ORBE_SKIP_LONG_FUZZ: ${{ github.event_name == 'pull_request' && '1' || '' }}
    steps:
      - uses: actions/checkout@v5
      - name: build (incl. tests)
        run: swift build --build-tests
      - name: test
        id: test
        # 出力を行ごとに出し、テストが固まれば sample を残して失敗で終える（scripts/ci-test.sh）。
        run: scripts/ci-test.sh "$RUNNER_TEMP/test-logs"
      - name: test timing
        if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        run: |
          set -o pipefail
          python3 scripts/test-timing.py "$RUNNER_TEMP/test-logs/swift-test.log" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: upload test logs
        if: ${{ always() && steps.test.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: ${{ runner.temp }}/test-logs
