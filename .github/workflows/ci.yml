name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-format:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
      - name: lint (SwiftLint)
        run: mise exec -- swiftlint lint --strict --quiet
      - name: format (swift format)
        run: swift format lint --strict --recursive Sources Tests Package.swift

  build-test:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # PR では、長時間ファズ（名前の末尾が AtFullScale のテスト）を飛ばす。ほかのイベントでは、この変数が空の文字列になり、長時間ファズも走る。
      ORBE_SKIP_LONG_FUZZ: ${{ github.event_name == 'pull_request' && '1' || '' }}
    steps:
      - uses: actions/checkout@v5
      - name: build (incl. tests)
        run: swift build --build-tests
      - name: diag509 testFindInProjectOpensTheEditorWithTheSearchFieldFocused x60
        # 使い捨ての診断。落ちたテスト 1 本だけを、1 回ごとに別のプロセスで 60 回回し、落ちた回数を集計する。
        id: test
        timeout-minutes: 40
        run: |
          fails=0
          for i in $(seq 1 60); do
            echo "::group::diag509 run $i"
            if scripts/ci-test.sh "$RUNNER_TEMP/test-logs/run-$i" \
              --filter 'OrbeTests.FindInProjectTests/testFindInProjectOpensTheEditorWithTheSearchFieldFocused'; then
              result=passed
            else
              result=failed
              fails=$((fails + 1))
            fi
            echo "::endgroup::"
            echo "DIAG509 run $i $result"
          done
          echo "DIAG509 summary failed=$fails/60"
          [ "$fails" -eq 0 ]
      - name: upload test logs
        if: ${{ always() && steps.test.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: ${{ runner.temp }}/test-logs
