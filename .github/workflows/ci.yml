name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: build (incl. tests)
        run: swift build --build-tests
      - name: interference 2
        run: |
          set +e
          run() { label=$1; shift; swift test --skip-build --filter "$1" 2>&1 | grep -E "error: -\[|Executed [0-9]+ tests, with [0-9]+ failures? .*seconds$" | sort -u | sed "s/^/$label: /"; }
          PROBE_NO_SCREEN=1 run "ps-without" 'OrbeTests\.(ProjectSearchPaneTests|SidebarScrollbarTests)/'
          run "ps-with" 'OrbeTests\.(ProjectSearchPaneTests|SidebarScrollbarTests)/'
          PROBE_NO_SCREEN=1 run "pr-without" 'OrbeTests\.(PullRequestPaneTests|SidebarScrollbarTests)/'
          run "pr-with" 'OrbeTests\.(PullRequestPaneTests|SidebarScrollbarTests)/'
          PROBE_NO_SCREEN=1 run "gu-without" 'OrbeTests\.(EditorSearchTests|EditorSurfaceHostTests|EditorZoneEditingMenuTests|FindInProjectTests|GroupFacesViewTests|SidebarScrollbarTests)/'
          run "gu-with" 'OrbeTests\.(EditorSearchTests|EditorSurfaceHostTests|EditorZoneEditingMenuTests|FindInProjectTests|GroupFacesViewTests|SidebarScrollbarTests)/'
