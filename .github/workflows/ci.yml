name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: build (incl. tests)
        run: swift build --build-tests
      - name: test
        run: swift test --skip-build --filter 'OrbeTests\.(TaskPaletteCardKeyTests|BoardAutomationTests|WorktreePaletteCardKeyTests|PaletteCardFocusTests|PaletteCardSegmentsTests)'
