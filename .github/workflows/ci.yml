name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-format:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
      - name: lint (SwiftLint)
        run: mise exec -- swiftlint lint --strict --quiet
      - name: format (swift format)
        run: swift format lint --strict --recursive Sources Tests Package.swift

  build-test:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: build (incl. tests)
        run: swift build --build-tests
      - name: test
        id: test
        # 既定のシェル（bash -e）には pipefail が無く、パイプの終了コードは tee のものになる。
        run: |
          set -o pipefail
          swift test --skip-build --filter '^OrbePathsTests\.' 2>&1 | tee "$RUNNER_TEMP/swift-test.log"
      - name: test timing
        if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        run: |
          set -o pipefail
          python3 scripts/test-timing.py "$RUNNER_TEMP/swift-test.log" | tee -a "$GITHUB_STEP_SUMMARY"
