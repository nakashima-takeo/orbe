name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: build (incl. tests)
        run: swift build --build-tests
      - name: test (wheel diagnosis)
        run: |
          set -o pipefail
          swift test --skip-build --filter 'OrbeTests\.(ZZWheelProbeTests|SidebarScrollbarTests)/' 2>&1 | tee test.log || true
          echo "===== WHEELDIAG ====="
          grep WHEELDIAG test.log || true
