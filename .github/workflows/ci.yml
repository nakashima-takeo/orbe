name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: build (incl. tests)
        run: swift build --build-tests
      - name: test (SidebarScrollbarTests x3 and the other placeOffscreen classes)
        run: |
          for i in 1 2 3; do swift test --skip-build --filter 'OrbeTests\.SidebarScrollbarTests/' 2>&1 | grep -E "SidebarScrollbarTests test.*(passed|failed)|error:|Executed" ; done
          swift test --skip-build --filter 'OrbeTests\.(EditorPaneViewPreviewTabTests|EditorPaneViewTabCloseTests|EditorLineMarksTests|EditorSearchTests|EditorDiffTests)/' 2>&1 | grep -E "failed|Executed [0-9]+ tests" | tail -5
