name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: build (incl. tests)
        run: swift build --build-tests
      - name: interference
        run: |
          set +e
          run() { label=$1; shift; swift test --skip-build --filter "$1" 2>&1 | grep -E "SidebarScrollbarTests.swift:[0-9]+: error|Executed [0-9]+ tests, with [0-9]+ failures? .*seconds$" | tail -2 | sed "s/^/$label: /"; }
          PROBE_NO_SCREEN=1 run "23-without" 'OrbeTests\.(UnsavedGateTests|EditorDiffTests|SourceControlPaneTests|EditorOccurrencesTests|EditorPaneSurfaceTests|EditorPaneViewCloseTests|EditorPaneViewTests|EditorPaneViewGutterTests|EditorPaneViewHeaderTests|EditorPaneViewInlineInputTests|EditorPaneViewPreviewTabTests|EditorPaneViewShellTests|EditorPaneViewSidebarTests|EditorPaneViewTabCloseTests|EditorSearchTests|EditorSurfaceHostTests|EditorZoneEditingMenuTests|FindInProjectTests|SidebarScrollbarTests|ProjectSearchPaneTests|PullRequestPaneTests|TabGroupTests|GroupFacesViewTests|TaskPaletteCardKeyTests|RowListTests|BoardAutomationTests|ChromeMiddleClickTests)/'
          run "23-with" 'OrbeTests\.(UnsavedGateTests|EditorDiffTests|SourceControlPaneTests|EditorOccurrencesTests|EditorPaneSurfaceTests|EditorPaneViewCloseTests|EditorPaneViewTests|EditorPaneViewGutterTests|EditorPaneViewHeaderTests|EditorPaneViewInlineInputTests|EditorPaneViewPreviewTabTests|EditorPaneViewShellTests|EditorPaneViewSidebarTests|EditorPaneViewTabCloseTests|EditorSearchTests|EditorSurfaceHostTests|EditorZoneEditingMenuTests|FindInProjectTests|SidebarScrollbarTests|ProjectSearchPaneTests|PullRequestPaneTests|TabGroupTests|GroupFacesViewTests|TaskPaletteCardKeyTests|RowListTests|BoardAutomationTests|ChromeMiddleClickTests)/'
          run "rowlist+sidebar" 'OrbeTests\.(RowListTests|SidebarScrollbarTests)/'
          run "projsearch..sidebar" 'OrbeTests\.(ProjectSearchPaneTests|PullRequestPaneTests|RowListTests|SidebarScrollbarTests)/'
          run "editorpane+sidebar" 'OrbeTests\.(EditorPaneSurfaceTests|EditorPaneViewCloseTests|EditorPaneViewTests|EditorPaneViewGutterTests|EditorPaneViewHeaderTests|EditorPaneViewInlineInputTests|EditorPaneViewPreviewTabTests|EditorPaneViewShellTests|EditorPaneViewSidebarTests|EditorPaneViewTabCloseTests|SidebarScrollbarTests)/'
          run "A-F+sidebar" 'OrbeTests\.(BoardAutomationTests|ChromeMiddleClickTests|EditorDiffTests|EditorOccurrencesTests|SidebarScrollbarTests)/'
          run "G-U+sidebar" 'OrbeTests\.(EditorSearchTests|EditorSurfaceHostTests|EditorZoneEditingMenuTests|FindInProjectTests|GroupFacesViewTests|SidebarScrollbarTests)/'
