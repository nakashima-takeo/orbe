# Orbe キュレート既定。後に読む ~/.config/ghostty が後勝ちで上書きする。
theme = light:OrbeLight,dark:OrbeDark
font-size = 12
# 本文等幅チェーン。プライマリは JetBrains Mono（4スタイル同梱・bold/italic も設計字形で解決）、
# 末尾に広カバレッジの JuliaMono を fallback として据える。font-family の各行は fallback=false の
# プライマリ face として埋め込み JetBrains より前に挿入され、JuliaMono が最後に照会されるため、
# JetBrains に無い記号（⎇▰▱ 等）が ghostty のフォント解決最終段 discovery（起動文脈・LANG 依存で
# 不安定）に落ちる前に決定論的に確定する。TTF は起動時に .process 登録済み（TerminalFonts.registerBundled）。
font-family = JetBrainsMono Nerd Font
font-family = JuliaMono
# 画面の不透明度（背景の透過）。設定パレットの既定 95% と対称。生成 gui.conf が後勝ちで上書きする。
background-opacity = 0.95
# 背景ブラー（すりガラス）。設定パレットの既定 true と対称。opacity<1 のとき libghostty が CGS ブラーを掛ける。生成 gui.conf が後勝ちで上書きする。
background-blur = true
# 日本語コードポイントを Hiragino Sans W3（レギュラー）に固定する。未指定だと CJK フォールバックが
# CTFontCreateForString 経由でプロセスの優先言語に依存し、起動文脈次第で簡体字フォントが
# 選ばれて仮名・漢字が中華字形になる。codepoint-map は解決順の最上位で名前解決するため、
# 起動が open か直接 exec か・LANG が何かに関わらず決定論的に日本語字形で描く（プライマリ等幅には不干渉）。
# ウェイトは W3 を明示する。ファミリ名だけ（"Hiragino Sans"）だと W0〜W9 が全マッチし極細の W0 が選ばれる。
# U+2E80-2EFF（部首補助）と U+3200-33FF（囲み CJK・CJK 互換）を含めるのはサイズ改善ではなく決定論化のため。
# これらは JetBrainsMono も JuliaMono もほぼ持たず、解決が起動文脈依存の discovery や「先に画面へ出た方の
# codepoint-map face」に落ちて ㈱ 等が実行ごとに違う書体で描かれうる。ほぼ全域が EAW=Wide で最初から 2 セル幅。
# 決定論化が効くのは Hiragino が実際に持つ範囲だけ（U+2E80-2EFF は 68/128、U+3200-33FF は 295/512）。
# 持たない分は libghostty の hasCodepoint 検証で委譲が外れ従来の解決順へ落ちる（退行はしないがそこは非決定論のまま）。
# 〰〽㊗㊙（U+3030・U+303D・U+3297・U+3299）を範囲から切り欠くのは、この 4 点が Emoji=Yes で VS16 付きの
# 絵文字表現を持つため。codepoint-map の override は presentation より先に効き（CodepointResolver.zig の
# getIndexCodepointOverride）検証も .any なのでモノクロの Hiragino で確定してしまい、㊗️ のような VS16 付きは
# 後段の emoji 検証で候補が全滅して置換文字に落ちる。素の ㊗㊙ は元からレンジ外で解決先が変わらないが、
# 素の 〰〽 は Hiragino から JuliaMono へ落ち、2 セル枠に 1 セル幅の字形が入る（〰 の連なりは波が途切れる）。
# VS16 付きが置換文字になるよりは軽いので受け入れる。
font-codepoint-map = U+2E80-U+2EFF,U+3000-U+302F,U+3031-U+303C,U+303E-U+303F,U+3040-U+309F,U+30A0-U+30FF,U+3200-U+3296,U+3298,U+329A-U+33FF,U+3400-U+4DBF,U+4E00-U+9FFF,U+F900-U+FAFF,U+FF00-U+FFEF=Hiragino Sans W3
# 囲み英数字（U+2460-24FF）・Miscellaneous Symbols（U+2600-26FF）・Dingbats の囲み数字（U+2776-277F）を
# Hiragino Sans W3 へ寄せる。上の行が決定論化のためなのに対し、こちらは書体を日本語に揃えるため。
# 対象は EAW=Ambiguous/Neutral で 1 セル幅に落ち、JuliaMono/JetBrainsMono の欧文字形が周囲の仮名漢字に
# 対して極端に小さく・書体も浮く（`日`(Hiragino) のインク高を 1.00 として ① は 0.56、★ は 0.53、
# ❶ は 0.60、♪ は 0.85）。Hiragino に寄せると囲みは正円になり、字形も周囲と同じ日本語書体で揃う。
# 必要条件は「libghostty の isSymbol ブロックであること」。この 3 ブロックは isSymbol なので
# （vendor/ghostty/src/build/uucode_config.zig の computeIsSymbol）、全角字形でも .fit 制約がセル枠に
# 収める。非 isSymbol の ※(U+203B)・●○◎◆◇■□▲△(U+25A0-25FF)・⌘(U+2318) は制約が一切掛からず、
# Hiragino の全角字形（インク幅 9.5〜12.2pt）が 7.2pt のセルから隣へはみ出すので触らない。
# ただし isSymbol は必要条件であって十分条件ではない。同じ isSymbol でも Arrows(U+2190-21FF) は寄せない
# ——Hiragino の ← はインクが 10.8x4.9pt と横長で 1 セル幅に入らず、.fit が幅で潰した結果の高さが
# JetBrainsMono の半分（3.3pt 対 6.7pt）になる。寄せるかどうかは字形を実測してから決める。
# 大きさは文脈で 1.68 倍揺れる。.fit は後続セルが空白なら 2 セル枠を使って原寸で描き（① は 1.14）、
# 詰まっているか・行末か・直前セルも記号なら 1 セル枠へ潰す（0.68。cell.zig の constraintWidth）。
# ①②③ の連続列記は 3 つ目の条件に当たり常に 1 セル枠。この揺れは承知の上で受け入れる——読めない小ささの方が痛い。
# ❶〜❿ の Hiragino インク（12.07x12.07pt）は ① と同寸なので、.fit 後も ① と同じ 0.68 に揃う。
# 隣の ➀〜➓(U+2780-2793) は寄せない——Hiragino が 20 点とも字形を持たず、委譲しても hasCodepoint 検証で
# 外れて元の解決先へ戻るだけ。レンジには実際に効くものだけを書く。
# レンジの穴は 2 種類ある。Emoji=Yes を外した穴（U+2460-24FF は Ⓜ(U+24C2) の 1 点、U+2600-26FF は
# ⚠(U+26A0)・☀☁♠♥ 等 83 点）は、埋めると上の行と同じ理屈で VS16 付き（Ⓜ️ ⚠️ ☀️ 等）が置換文字に落ちる。
# Hiragino が 1 点も字形を持たない区間を外した穴（U+2600-26FF 側）は、埋めても hasCodepoint 検証で
# 外れるだけで無害——レンジを短く保つためだけの穴。壊れるのは前者だけ。
# 実効カバレッジは囲み 148/159 点（U+2491-249B は Hiragino が持たない）・記号 30/46 点・Dingbats 10/10 点。
font-codepoint-map = U+2460-U+24C1,U+24C3-U+24FF,U+2605-U+260D,U+2616-U+2617,U+2619-U+261C,U+261E-U+261F,U+2661-U+2662,U+2664,U+2667,U+2669-U+267A,U+267C-U+267D,U+26C9-U+26CD,U+2776-U+277F=Hiragino Sans W3
# emoji の font-codepoint-map は生成 gui.conf（emoji-font 設定・常時 emit・後勝ち）が単一出所として持つ。
window-padding-x = 8
window-padding-y = 8
cursor-style = block
# カーソルの点滅 ON（Orbe 既定）。カーソル色はテーマ側 cursor-color が単一の出所。
# 点滅周期は Ghostty ハードコードの標準 600ms（chrome の blink 1.1s とは異なる。docs/design-system.md §8 参照）。
cursor-style-blink = true
# shell-integration がカーソルを上書きするのと、precmd/preexec で OSC 2 タイトル（cwd/コマンド名）を
# 送るのを止める。タブ名は Orbe が 3 層 precedence で解決する（アプリ自前の OSC 2 は影響を受けない）。
shell-integration-features = no-cursor,no-title
